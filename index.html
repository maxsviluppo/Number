  <style>
    :root {
      --hex-scale: 1.70;
      /* Cristalli: saturazione ridotta per evitare arancione eccessivo */
      --hex-crystal-brightness: 1.25;
      --hex-crystal-contrast: 1.05;
      --hex-crystal-saturate: 0.88;
      --hex-num-orange-glow: 0;
      --hex-num-orange-glow-selected: 0.20;
      /* Boost selezione celle attive */
      --hex-select-brightness: 1.14;
      --hex-select-contrast: 1.10;
      --hex-select-saturate: 1.12;
      --hex-select-glow-alpha: 0.22;
      --hex-select-glow-spread: 12px;
      --game-bg-saturate: 1.05;
      --game-bg-contrast: 1.13;
    }

    /* Telefono / touch: ulteriore desaturazione (OLED e Safari amplificano i colori) */
    @media (hover: none) and (pointer: coarse) {
      :root {
        --hex-crystal-saturate: 0.75;
        --hex-crystal-brightness: 1.25;
        --hex-crystal-contrast: 1.05;
        --hex-num-orange-glow: 0;
        --hex-num-orange-glow-selected: 0.11;
        --hex-select-brightness: 1.12;
        --hex-select-contrast: 1.08;
        --hex-select-saturate: 1.10;
        --hex-select-glow-alpha: 0.18;
        --hex-select-glow-spread: 10px;
      }
    }

    @media (max-width: 1024px) {
      :root {
        --hex-scale: 1.60;
      }
    }

    @media (max-width: 768px) {
      :root {
        --hex-scale: 1.50;
      }
    }

    @media (max-width: 480px) {
      :root {
        --hex-scale: 1.25;
      }
    }

    @media (max-width: 410px) {
      :root {
        --hex-scale: 1.15;
      }
    }

    @media (max-width: 380px) {
      :root {
        --hex-scale: 1.00;
      }
    }

    @media (max-width: 340px) {
      :root {
        --hex-scale: 0.85;
      }
    }

    /* Regole avanzate per altezze di schermi Android nativi / schermi pieghevoli */
    @media (max-height: 850px) {
      :root {
        --hex-scale: 1.15;
      }
    }

    @media (max-height: 750px) {

    @keyframes rotate-energy {

    @keyframes screen-in {

      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .energy-ring {
      position: absolute;

          transparent 20%,

          #6366f1 50%,
          #22d3ee 55%,
          transparent 80%);

      z-index: -1;
      filter: blur(25px);

    }

    .logo-inner-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(34, 211, 238, 0.3) 0%, transparent 85%);
      pointer-events: none;
    }

    .logo-outline {
      position: absolute;
      inset: 0;
      border: 2px solid rgba(34, 211, 238, 0.4);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      pointer-events: none;
    }

    @keyframes hex-entry {
      0% {
        opacity: 0;
        transform: translateY(-200px) scale(0);
      }

      70% {
        transform: translateY(15px) scale(1.1);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-hex-entry {
      animation: hex-entry 0.62s cubic-bezier(0.34, 1.45, 0.64, 1) forwards;
      opacity: 0;
    }

    @keyframes hex-select {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }

      100% {
        transform: scale(1.1);
      }
    }

    .animate-hex-select {
      animation: hex-select 0.11s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes hex-deselect {
      0% {
        transform: scale(1.1);
      }

      100% {
        transform: scale(1);
      }
    }

    .animate-hex-deselect {
      animation: hex-deselect 0.11s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* Effetto Palloncino 3D (Inflate & Deflate +40%) - correct path celebration */
    @keyframes hex-correct-bounce {
      0%   { transform: scale3d(1, 1, 1); }
      30%  { transform: scale3d(1.4, 1.4, 1); }   /* Gonfiamento sferico massimo (+40%) */
      48%  { transform: scale3d(1.35, 1.45, 1); } /* Deformazione d'aria verticale */
      65%  { transform: scale3d(1.45, 1.35, 1); } /* Deformazione d'aria orizzontale */
      82%  { transform: scale3d(0.92, 0.92, 1); } /* Sgonfiamento fulmineo e rimbalzo a vuoto */
      100% { transform: scale3d(1, 1, 1); }      /* Stato stabile iniziale */
    }
    .animate-hex-correct-bounce {
      transform-origin: bottom center !important; /* Mantiene la base immobile */
      animation: hex-correct-bounce 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    /* Spazzamento del Riflesso Luminoso Bianco (Step 2: Glass Shine Sweep) */
    @keyframes hex-shine-sweep {
      0%   { left: -150%; }
      20%  { left: -150%; }
      40%  { left: 150%; }
      100% { left: 150%; }
    }

    /* Coreografia Celebrazione Target in 4 Fasi (Step 1-4) */
    @keyframes hex-target-star-bounce {
      /* STEP 1: Pop in dal nulla elastico (0% - 20%) */
      0%   { transform: scale3d(0, 0, 1); opacity: 0; }
      10%  { transform: scale3d(1.2, 1.2, 1); opacity: 1; }
      20%  { transform: scale3d(1, 1, 1); opacity: 1; }

      /* STEP 2: Specular reflect sweep - Target immobile per far passare il riflesso (20% - 85%) */
      20%  { transform: scale3d(1, 1, 1) translateY(0) rotate(0deg); }
      85%  { transform: scale3d(1, 1, 1) translateY(0) rotate(0deg); }

      /* STEP 4: Rimpicciolimento rapido fino a sparire nel nulla (85% - 100%) */
      85%  { transform: translateY(0) scale3d(1, 1, 1) rotate(0deg); opacity: 1; }
      92%  { transform: translateY(0) scale3d(1.12, 1.12, 1) rotate(4deg); opacity: 1; }
      100% { transform: translateY(0) scale3d(0, 0, 1) rotate(-10deg); opacity: 0; }
    }

    .animate-hex-correct-bounce-delayed {
      position: relative;
      overflow: hidden;
      transform-origin: bottom center !important; /* Ancoraggio fisso alla base */
      animation: hex-target-star-bounce 0.47s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      animation-delay: 25ms !important; /* Ritardo di cascata dinamica */
    }

    /* Pseudo-elemento per il riflesso di luce lucido (Step 2 pseudo shine sweep) */
    .animate-hex-correct-bounce-delayed::after {
      content: '';
      position: absolute;
      top: -20%;
      left: -150%;
      width: 120%;
      height: 140%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.75),
        transparent
      );
      transform: skewX(-25deg);
      pointer-events: none;
      z-index: 30;
      animation: hex-shine-sweep 0.47s linear forwards;
      animation-delay: 25ms !important;
    }

    /* Flash Reflect - white specular flash for correct and wrong */
    @keyframes hex-flash-reflect {
      0%   { opacity: 0; }
      25%  { opacity: 0.44; }
      60%  { opacity: 0.28; }
      100% { opacity: 0; }
    }
    .animate-hex-flash-reflect {
      animation: hex-flash-reflect 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fallen {
      0% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }

      100% {
        opacity: 0;
        transform: scale(0.2) translateY(100px);
        filter: blur(10px);
      }
    }

    .animate-fallen {
      animation: fallen 0.48s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
      pointer-events: none;
    }

    /* Grid finale — win: radial burst from center, outer → inner wave */
    @keyframes crystalFinaleBurst {
      0% {
        opacity: 1;
        transform: translate(0, 0) scale(1) rotate(0deg);
        filter: blur(0);
      }
      10% {
        opacity: 1;
        transform: translate(calc(var(--burst-x) * 0.06), calc(var(--burst-y) * 0.06)) scale(1.05) rotate(calc(var(--burst-rot) * 0.08));
        filter: blur(0);
      }
      38% {
        opacity: 1;
        transform: translate(calc(var(--burst-x) * 0.32), calc(var(--burst-y) * 0.32)) scale(1.08) rotate(calc(var(--burst-rot) * 0.28));
        filter: blur(0);
      }
      68% {
        opacity: 0.9;
        transform: translate(calc(var(--burst-x) * 0.68), calc(var(--burst-y) * 0.68)) scale(0.82) rotate(calc(var(--burst-rot) * 0.62));
        filter: blur(1px);
      }
      88% {
        opacity: 0.45;
        transform: translate(calc(var(--burst-x) * 0.9), calc(var(--burst-y) * 0.9)) scale(0.55) rotate(calc(var(--burst-rot) * 0.85));
        filter: blur(3px);
      }
      100% {
        opacity: 0;
        transform: translate(var(--burst-x), var(--burst-y)) scale(0.38) rotate(var(--burst-rot));
        filter: blur(7px);
      }
    }

    .animate-crystal-finale-burst {
      animation: crystalFinaleBurst var(--burst-duration, 1.75s) cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
      pointer-events: none;
      z-index: 30;
    }

    /* Grid finale — lose: random detach and fall */
    @keyframes crystalFinaleFall {
      0% {
        opacity: 1;
        transform: translate(0, 0) rotate(0deg) scale(1);
        filter: blur(0);
      }
      12% {
        transform: translate(calc(var(--fall-drift) * 0.25), -8px) rotate(calc(var(--fall-rot) * 0.12)) scale(1.04);
      }
      100% {
        opacity: 0;
        transform: translate(var(--fall-drift), 260px) rotate(var(--fall-rot)) scale(0.3);
        filter: blur(8px);
      }
    }

    .animate-crystal-finale-fall {
      animation: crystalFinaleFall 1.1s cubic-bezier(0.55, 0.055, 0.675, 0.19) forwards;
      pointer-events: none;
    }

    @keyframes gridFinaleTitlePop {
      0% {
        opacity: 0;
        transform: scale(0.6);
      }
      60% {
        opacity: 1;
        transform: scale(1.06);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    .grid-finale-title {
      opacity: 0;
      transform: scale(0.6);
      width: 100%;
      padding: 0 1rem;
      box-sizing: border-box;
    }

    .grid-finale-title-visible {
      animation: gridFinaleTitlePop 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;

    .grid-finale-title-win span,
    .grid-finale-title-lose span {
      display: block;

      font-weight: 900;
      line-height: 1.05;
      letter-spacing: clamp(0.02em, 0.5vw, 0.05em);
      text-transform: uppercase;
      text-align: center;
      max-width: calc(100vw - 2rem);
      margin: 0 auto;
      white-space: nowrap;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      background-color: transparent;
    }

    .grid-finale-title-win.grid-finale-title-visible span {
      background-image: linear-gradient(168deg, #fffef5 0%, #ffe8a8 18%, #ffaa33 42%, #ff7700 68%, #ff4400 100%);

    .grid-finale-title-lose.grid-finale-title-visible span {
      background-image: linear-gradient(168deg, #fff8f8 0%, #ffcccc 20%, #ff5555 48%, #dd2222 72%, #991111 100%);
    }

    @keyframes vibrate {
      0% {
        transform: translate(0, 0) rotate(0);
      }

      20% {
        transform: translate(-2px, 1px) rotate(-0.5deg);
      }

      40% {
        transform: translate(-2px, -1px) rotate(0.5deg);
      }

      60% {
        transform: translate(2px, 1px) rotate(-0.5deg);
      }

      80% {
        transform: translate(2px, -1px) rotate(0.5deg);
      }

      100% {
        transform: translate(0, 0) rotate(0);
      }
    }

    .animate-vibrate {
      animation: vibrate 0.15s linear infinite;
    }

    /* Custom Scrollbar - Neon Green Style */

  <style>
    /* Prevent blue tap highlight and selection for native feel */
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    input,
    textarea {
      user-select: text !important;
      -webkit-user-select: text !important;
    }

    /* ============================================
       PLASMA ENERGY CORE VFX — Two-Phase Animation
       Phase 1 (0–0.9s): Sphere appears & pulses
       Phase 2 (0.9–1.6s): Explosion & fade out
       Target collapse starts with 1.2s delay
       ============================================ */

    /* PHASE 1+2: Outer bloom — pulses then expands outward */
    @keyframes plasmaBloomLife {
      0%   { transform: scale(0);   opacity: 0; filter: blur(10px); }
      10%  { transform: scale(1.2); opacity: 0.7; filter: blur(8px); }
      30%  { transform: scale(1.0); opacity: 0.5; filter: blur(10px); }
      50%  { transform: scale(1.3); opacity: 0.75; filter: blur(8px); }
      65%  { transform: scale(1.0); opacity: 0.55; filter: blur(10px); }
      /* — Explosion starts — */
      75%  { transform: scale(1.2); opacity: 0.7; filter: blur(6px); }
      100% { transform: scale(3.5); opacity: 0;   filter: blur(22px); }
    }

    /* PHASE 1+2: Cyan sphere — appears, pulses with glow, then bursts */
    @keyframes plasmaSphereLife {
      0%   { transform: scale(0);   opacity: 0; box-shadow: 0 0 0px rgba(0,235,255,0); }
      8%   { transform: scale(1.15); opacity: 1; box-shadow: 0 0 30px rgba(0,235,255,0.9), inset 0 0 16px rgba(0,235,255,0.8); }
      22%  { transform: scale(0.9); opacity: 0.85; box-shadow: 0 0 15px rgba(0,235,255,0.5), inset 0 0 8px rgba(0,235,255,0.4); }
      38%  { transform: scale(1.1); opacity: 1;   box-shadow: 0 0 35px rgba(0,235,255,1),   inset 0 0 20px rgba(0,235,255,0.9); }
      55%  { transform: scale(0.92); opacity: 0.9; box-shadow: 0 0 18px rgba(0,235,255,0.6), inset 0 0 10px rgba(0,235,255,0.5); }
      68%  { transform: scale(1.05); opacity: 1;  box-shadow: 0 0 28px rgba(0,235,255,0.85),inset 0 0 15px rgba(0,235,255,0.75); }
      /* — Explosion starts — */
      78%  { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(2.8); opacity: 0; filter: blur(10px); }
    }

    /* PHASE 1+2: White nucleus — pulses brightly then implodes */
    @keyframes plasmaNucleusLife {
      0%   { transform: scale(0);   opacity: 0;   box-shadow: 0 0 0 #fff; }
      8%   { transform: scale(1.4); opacity: 1;   box-shadow: 0 0 16px #fff, 0 0 32px #00ebff; }
      22%  { transform: scale(0.8); opacity: 0.8; box-shadow: 0 0 8px  #fff, 0 0 16px #00ebff; }
      38%  { transform: scale(1.5); opacity: 1;   box-shadow: 0 0 20px #fff, 0 0 40px #00ebff; }
      55%  { transform: scale(0.8); opacity: 0.9; box-shadow: 0 0 10px #fff, 0 0 20px #00ebff; }
      68%  { transform: scale(1.3); opacity: 1;   box-shadow: 0 0 18px #fff, 0 0 36px #00ebff; }
      /* — Explosion: nucleus flares then vanishes — */
      78%  { transform: scale(2.0); opacity: 1;   box-shadow: 0 0 30px #fff, 0 0 60px #00ebff; }
      100% { transform: scale(0.1); opacity: 0;   box-shadow: 0 0 0 #fff; }
    }

    /* PHASE 1: Particles orbit tightly; PHASE 2: scatter outward */
    @keyframes plasmaOrbit1 {
      0%   { transform: translate(-50%,-50%) rotate(0deg)   translate(7px)  scale(0); opacity: 0; }
      10%  { transform: translate(-50%,-50%) rotate(30deg)  translate(7px)  scale(1); opacity: 1; }
      65%  { transform: translate(-50%,-50%) rotate(250deg) translate(7px)  scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) rotate(405deg) translate(40px) scale(0); opacity: 0; }
    }
    @keyframes plasmaOrbit2 {
      0%   { transform: translate(-50%,-50%) rotate(45deg)  translate(7px)  scale(0); opacity: 0; }
      10%  { transform: translate(-50%,-50%) rotate(75deg)  translate(7px)  scale(1); opacity: 1; }
      65%  { transform: translate(-50%,-50%) rotate(295deg) translate(7px)  scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) rotate(450deg) translate(40px) scale(0); opacity: 0; }
    }
    @keyframes plasmaOrbit3 {
      0%   { transform: translate(-50%,-50%) rotate(90deg)  translate(7px)  scale(0); opacity: 0; }
      10%  { transform: translate(-50%,-50%) rotate(120deg) translate(7px)  scale(1); opacity: 1; }
      65%  { transform: translate(-50%,-50%) rotate(340deg) translate(7px)  scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) rotate(495deg) translate(40px) scale(0); opacity: 0; }
    }
    @keyframes plasmaOrbit4 {
      0%   { transform: translate(-50%,-50%) rotate(135deg) translate(7px)  scale(0); opacity: 0; }
      10%  { transform: translate(-50%,-50%) rotate(165deg) translate(7px)  scale(1); opacity: 1; }
      65%  { transform: translate(-50%,-50%) rotate(385deg) translate(7px)  scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) rotate(540deg) translate(40px) scale(0); opacity: 0; }
    }
    @keyframes plasmaOrbit5 {
      0%   { transform: translate(-50%,-50%) rotate(180deg) translate(7px)  scale(0); opacity: 0; }
      10%  { transform: translate(-50%,-50%) rotate(210deg) translate(7px)  scale(1); opacity: 1; }
      65%  { transform: translate(-50%,-50%) rotate(430deg) translate(7px)  scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) rotate(585deg) translate(40px) scale(0); opacity: 0; }
    }
    @keyframes plasmaOrbit6 {
      0%   { transform: translate(-50%,-50%) rotate(225deg) translate(7px)  scale(0); opacity: 0; }
      10%  { transform: translate(-50%,-50%) rotate(255deg) translate(7px)  scale(1); opacity: 1; }
      65%  { transform: translate(-50%,-50%) rotate(475deg) translate(7px)  scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) rotate(630deg) translate(40px) scale(0); opacity: 0; }
    }
    @keyframes plasmaOrbit7 {
      0%   { transform: translate(-50%,-50%) rotate(270deg) translate(7px)  scale(0); opacity: 0; }
      10%  { transform: translate(-50%,-50%) rotate(300deg) translate(7px)  scale(1); opacity: 1; }
      65%  { transform: translate(-50%,-50%) rotate(520deg) translate(7px)  scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) rotate(675deg) translate(40px) scale(0); opacity: 0; }
    }
    @keyframes plasmaOrbit8 {
      0%   { transform: translate(-50%,-50%) rotate(315deg) translate(7px)  scale(0); opacity: 0; }
      10%  { transform: translate(-50%,-50%) rotate(345deg) translate(7px)  scale(1); opacity: 1; }
      65%  { transform: translate(-50%,-50%) rotate(565deg) translate(7px)  scale(1); opacity: 1; }
      100% { transform: translate(-50%,-50%) rotate(720deg) translate(40px) scale(0); opacity: 0; }
    }

    /* Target collapses AFTER plasma finishes (1.2s delay) */
    @keyframes targetCollapse {
      0%   { opacity: 1; width: auto; max-width: 100px; min-width: 0; margin: 0 4px; padding: 0; }
      60%  { opacity: 0; width: 56px; min-width: 56px; margin: 0 4px; padding: 0; }
      100% {
        opacity: 0; width: 0px; min-width: 0px; max-width: 0px;
        margin: 0px -4px; padding: 0px;
        border: none; box-shadow: none;
        visibility: hidden; pointer-events: none;
      }
    }

    .animate-target-completed {
      animation: targetCollapse 0.7s ease-in 1.4s forwards !important;
    }

    /* ---- Component Styles ---- */
    .plasma-core-wrapper {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
      background: radial-gradient(circle, rgba(5,15,35,0.92) 0%, rgba(2,6,23,0.98) 100%) !important;
      z-index: 10;
      border-radius: inherit;
      pointer-events: none;
    }

    .plasma-bloom {
      position: absolute;
      width: 150%;
      height: 150%;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(0,235,255,0.5) 0%,
        rgba(0,200,255,0.2) 40%,
        rgba(0,150,255,0.05) 65%,
        transparent 80%
      );
      filter: blur(10px);
      animation: plasmaBloomLife 1.6s ease-in-out forwards;
    }

    .plasma-sphere {
      position: absolute;
      width: 62%;
      height: 62%;
      border-radius: 50%;
      background: radial-gradient(circle,
        rgba(180,255,255,0.08) 0%,
        rgba(0,235,255,0.55) 55%,
        rgba(0,200,255,0.92) 100%
      );
      border: 1.5px solid rgba(0,235,255,0.6);
      box-shadow:
        0 0 18px rgba(0,235,255,0.7),
        0 0 40px rgba(0,200,255,0.3),
        inset 0 0 14px rgba(0,235,255,0.55);
      animation: plasmaSphereLife 1.6s ease-in-out forwards;
    }

    .plasma-sphere::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background-image: radial-gradient(circle, rgba(255,255,255,0.35) 1px, transparent 1px);
      background-size: 3px 3px;
      opacity: 0.65;
      mix-blend-mode: overlay;
      animation: textureTurbulence 0.6s linear infinite;
    }

    @keyframes textureTurbulence {
      0%   { background-position: 0px 0px; }
      100% { background-position: 10px 10px; }
    }

    .plasma-nucleus {
      position: absolute;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #d0f8ff 80%);
      box-shadow: 0 0 10px #ffffff, 0 0 22px rgba(0,235,255,0.9);
      z-index: 2;
      animation: plasmaNucleusLife 1.6s ease-in-out forwards;
    }

    .plasma-cluster {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: visible;
      z-index: 3;
    }

    .plasma-cluster .micro-particle {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 4px;
      height: 4px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 0 5px #ffffff, 0 0 10px #00ebff, 0 0 18px rgba(0,235,255,0.6);
    }

    .plasma-cluster .mp1 { animation: plasmaOrbit1 1.6s cubic-bezier(0.4,0,0.2,1) forwards; }
    .plasma-cluster .mp2 { animation: plasmaOrbit2 1.6s cubic-bezier(0.4,0,0.2,1) forwards; }
    .plasma-cluster .mp3 { animation: plasmaOrbit3 1.6s cubic-bezier(0.4,0,0.2,1) forwards; }
    .plasma-cluster .mp4 { animation: plasmaOrbit4 1.6s cubic-bezier(0.4,0,0.2,1) forwards; }
    .plasma-cluster .mp5 { animation: plasmaOrbit5 1.6s cubic-bezier(0.4,0,0.2,1) forwards; }
    .plasma-cluster .mp6 { animation: plasmaOrbit6 1.6s cubic-bezier(0.4,0,0.2,1) forwards; }
    .plasma-cluster .mp7 { animation: plasmaOrbit7 1.6s cubic-bezier(0.4,0,0.2,1) forwards; }
    .plasma-cluster .mp8 { animation: plasmaOrbit8 1.6s cubic-bezier(0.4,0,0.2,1) forwards; }
  </style>
</body>
